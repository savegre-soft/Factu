<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Factu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="paper" x1="58" y1="40" x2="142" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9F5F1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#053B33" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Rounded app-icon background -->
  <rect x="0" y="0" width="200" height="200" rx="46" fill="url(#bg)"/>

  <!-- Receipt / invoice paper with a torn zig-zag bottom edge -->
  <g filter="url(#shadow)">
    <path d="M58 48
             a8 8 0 0 1 8 -8 H134 a8 8 0 0 1 8 8 V152
             l-10.5 8 -10.5 -8 -10.5 8 -10.5 -8 -10.5 8 -10.5 -8 -10.5 8 -10.5 -8
             Z"
          fill="url(#paper)"/>
  </g>

  <!-- Invoice header block -->
  <rect x="72" y="60" width="36" height="9" rx="4.5" fill="#0E7490"/>
  <!-- Line items -->
  <rect x="72" y="82"  width="52" height="6" rx="3" fill="#C6D6D0"/>
  <rect x="72" y="96"  width="52" height="6" rx="3" fill="#C6D6D0"/>
  <rect x="72" y="110" width="34" height="6" rx="3" fill="#C6D6D0"/>

  <!-- Verified / accepted seal -->
  <circle cx="128" cy="122" r="23" fill="#10B981" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M118 122 l7 7 l13 -15" fill="none" stroke="#FFFFFF" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
