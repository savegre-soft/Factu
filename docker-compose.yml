# Levanta la API + PostgreSQL para correr todo en la laptop:
#   docker compose up --build
# Luego: API en http://localhost:3001 y documentación en http://localhost:3001/docs
#
# Puertos de host deliberadamente distintos de RestauCloud-API (3000/5432,
# `../../RestroCloud/RestauCloud-API`) — ambos proyectos corren en la misma
# máquina de desarrollo y competían por los mismos puertos por defecto.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: factu
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d factu"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      # clave.ts genera la fecha de la clave con hora LOCAL del proceso; sin TZ
      # el contenedor corre en UTC y adelanta esa fecha un día después de las
      # 18:00 CR -> Hacienda -405/-16. NO quitar.
      TZ: America/Costa_Rica
      # Este stack corre con NODE_ENV=production pero es el entorno local, así
      # que la documentación interactiva se deja encendida a propósito. En un
      # servidor real, quitar esta línea la apaga.
      DOCS_PUBLICAS: "true"
      # Persistencia en PostgreSQL
      PERSISTENCIA: prisma
      DATABASE_URL: postgresql://postgres:postgres@db:5432/factu?schema=public
      # Secretos: vienen del archivo .env (no versionado), NUNCA en este archivo.
      # Sin ellos el arranque falla a propósito: un valor por defecto aquí queda
      # público en el repositorio, y la llave maestra es la que cifra los .p12.
      # Genera unos nuevos con:  node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      # Si cambias FACTU_MASTER_KEY hay que recifrar lo guardado:
      #   node scripts/rotar-llave-maestra.mjs   (ver cabecera del script)
      FACTU_MASTER_KEY: ${FACTU_MASTER_KEY:?define FACTU_MASTER_KEY en .env}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      # Ambiente de pruebas de Hacienda (ajusta las URLs a las oficiales del sandbox)
      HACIENDA_ENV: stag
      HACIENDA_IDP_URL: https://idp.comprobanteselectronicos.go.cr/auth/realms/rut-stag/protocol/openid-connect/token
      HACIENDA_API_URL: https://api-sandbox.comprobanteselectronicos.go.cr/recepcion/v1
      HACIENDA_CLIENT_ID: api-stag
      # Política de firma XAdES-EPES — valores oficiales verificados en vivo contra
      # Hacienda v4.4. Sin ambos, la firma sale como BES y Hacienda la rechaza
      # ("La firma del comprobante no tiene el Policy Id").
      HACIENDA_POLICY_URL: "https://cdn.comprobanteselectronicos.go.cr/xmlschemas/Resoluci%C3%B3n_General_sobre_disposiciones_t%C3%A9cnicas_comprobantes_electr%C3%B3nicos_para_efectos_tributarios.pdf"
      HACIENDA_POLICY_HASH: "DWxin1xWOeI8OuWQXazh4VjLWAaCLAA954em7DMh0h8="
      # Cédula del proveedor del sistema de facturación (nodo ProveedorSistemas,
      # obligatorio en v4.4). Vacío = se usa la cédula del propio emisor.
      PROVEEDOR_SISTEMAS: ""
      # Entrega del comprobante al cliente por correo (rellena el SMTP para activarla).
      ENTREGA_ENABLED: "true"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: ""
    # Crea/actualiza las tablas y arranca el servidor
    command: sh -c "npx prisma db push --skip-generate && node dist/main.js"
    # Un contenedor vivo pero con la API caída se ve igual que uno sano sin esto.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    ports:
      - "3001:3000"

volumes:
  pgdata:
